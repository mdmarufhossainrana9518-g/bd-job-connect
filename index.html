<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BD JOB CONNECT</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ea;--card:#fffefb;--ink:#14231f;--mute:#5d6b66;--line:#ddd9cc;--brand:#0c5a46;--brand-ink:#fff;--accent:#e0a21b;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1816;--card:#18241f;--ink:#eef2ee;--mute:#9aaba4;--line:#2a3a34;--brand:#3fb68f;--brand-ink:#05231a;--accent:#f0b840;--danger:#f2877f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1816;--card:#18241f;--ink:#eef2ee;--mute:#9aaba4;--line:#2a3a34;--brand:#3fb68f;--brand-ink:#05231a;--accent:#f0b840;--danger:#f2877f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:84px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:20px 0 12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:.2px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);position:relative;flex:none}
.mark::before,.mark::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;top:11px}
.mark::before{left:6px;background:var(--brand-ink)}
.mark::after{right:6px;background:var(--accent)}
.tag{color:var(--mute);margin:2px 0 0 44px;font-size:14px}
.search{display:flex;gap:8px;margin:14px 0 10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:8px;margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.count{color:var(--mute);font-size:14px;margin:4px 0 10px}
.job{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:6px 14px 14px 6px;padding:14px;margin-bottom:12px;cursor:pointer}
.job h3{margin:0 0 2px;font-size:18px;line-height:1.35}
.co{color:var(--mute);font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:14px}
.sal{font-weight:600;color:var(--brand)}
.row{display:flex;justify-content:space-between;align-items:start;gap:10px}
.save{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mute);padding:2px 6px;line-height:1}
.save[aria-pressed="true"]{color:var(--accent)}
.badge{display:inline-block;font-size:13px;padding:1px 10px;border-radius:999px;background:var(--line);color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:40px 10px;border:1.5px dashed var(--line);border-radius:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:10px 0 8px;cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.1}
nav button[aria-current="page"]{color:var(--brand);font-weight:600}
.btn{border:0;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;cursor:pointer;width:100%}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--line)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none}
.sheet-bg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.sheet h2{margin:0 0 4px;font-size:22px;line-height:1.3}
.sheet h4{margin:16px 0 4px;font-size:16px}
.sheet p,.sheet li{margin:4px 0}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;display:none;max-width:90%}
.err{color:var(--danger);font-size:14px;margin-top:4px}
h2.pt{font-size:22px;margin:6px 0 2px}
header.top{background:var(--brand);color:var(--brand-ink);padding:20px 0 26px;border-radius:0 0 26px 26px;margin-bottom:6px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--accent);opacity:.2}
header.top .in{max-width:640px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
header.top .logo{font-size:24px;gap:12px}
header.top .mark{width:42px;height:42px;border-radius:13px;background:var(--brand-ink)}
header.top .mark::before,header.top .mark::after{width:13px;height:13px;top:14px}
header.top .mark::before{background:var(--brand);left:7px}
header.top .mark::after{background:var(--accent);right:7px}
header.top .tag{color:inherit;opacity:.88;margin:6px 0 0;font-size:15px}
header.top .hc{display:inline-block;margin-top:12px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 14px;font-size:14px}
header.top .hc:empty{display:none}
.sec{font-size:18px;margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cat{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px;text-align:left;cursor:pointer}
span.cat{cursor:default}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.step b{display:block}
.step span{color:var(--mute);font-size:15px}
.hrow{display:flex;align-items:center;gap:12px}
.av{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--brand-ink);color:var(--brand);display:grid;place-items:center;font:inherit;font-weight:700;font-size:18px;border:0;cursor:pointer}
.av[hidden]{display:none}
.hsearch{display:flex;background:var(--card);border-radius:12px;margin-top:14px;overflow:hidden}
.hsearch input{border:0;border-radius:0;background:transparent;color:var(--ink)}
.hsearch button{border:0;background:none;font-size:20px;padding:0 14px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:16px}
.stats b{display:block;font-size:26px;line-height:1.2}
.stats span{font-size:13px;opacity:.9}
.qg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.q{background:none;border:0;font:inherit;color:var(--ink);font-size:13px;text-align:center;cursor:pointer;padding:4px 0}
.q i{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-style:normal;font-size:26px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#1b1500;border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:15;cursor:pointer}
.pcard{display:flex;gap:14px;align-items:center;margin-top:10px}
.pav{flex:none;width:64px;height:64px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:28px;font-weight:700}
.pbar{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.prow{display:flex;justify-content:space-between;margin-bottom:8px}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--brand);border-radius:99px}
.qg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.qg3.two{grid-template-columns:repeat(2,1fr)}
.qg3>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.qg3 b{display:block;font-size:22px}
.qg3 span{font-size:13px;color:var(--mute)}
.drows{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.drow{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow span{color:var(--mute)}
.drow b{font-weight:600;text-align:right}
.acts{display:flex;gap:8px;margin-top:10px}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.pphoto{flex:none;width:78px;height:98px;border-radius:12px;background:var(--card);border:1.5px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:13px;color:var(--mute);overflow:hidden;cursor:pointer;line-height:1.4}
.pphoto img,.av img{width:100%;height:100%;object-fit:cover;display:block}
.av{overflow:hidden;padding:0}
.pboxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.pb.full{grid-column:1/-1}
.pb .prow{margin-bottom:8px}
.arow{display:flex;gap:12px;align-items:flex-start}
.thumb{width:56px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.cvdoc{background:#fff;color:#111;border-radius:10px;padding:18px;font-size:15px}
.cvh{display:flex;gap:14px;align-items:flex-start;border-bottom:2px solid #0c5a46;padding-bottom:12px}
.cvh img{width:84px;height:108px;object-fit:cover;border-radius:6px}
.cvh h2{margin:0 0 4px;font-size:24px;color:#0c5a46}
.cvs h4{margin:14px 0 4px;color:#0c5a46;font-size:16px;border-bottom:1px solid #ddd;padding-bottom:2px}
.cvs p{margin:2px 0;white-space:pre-wrap;color:#111}
.cvchips span{display:inline-block;background:#e6f2ee;color:#111;border-radius:99px;padding:2px 10px;margin:2px 4px 2px 0;font-size:14px}
@media print{body>*:not(#bg){display:none!important}#bg{position:static!important;background:none!important;display:block!important}.sheet{position:static!important;max-height:none!important;overflow:visible!important;background:#fff!important;padding:0!important}.noprint{display:none!important}.cvdoc{border-radius:0;padding:0}}
</style>
</head>

  return '<article class="job"><h3>'+esc(j.t)+'</h3><div class="co">'+esc(locStr(j))+'</div><div class="meta"><span class="sal">'+esc(j.sal)+'</span><span>আবেদন: '+bn(n)+'</span>'+(j.closed?'<span class="badge">বন্ধ</span>':'')+'</div>'+
  '<div class="acts"><button class="btn alt sm" data-toggle="'+esc(j.id)+'">'+(j.closed?"আবার চালু করুন":"বন্ধ করুন")+'</button><button class="btn alt sm danger" data-del="'+esc(j.id)+'">মুছে ফেলুন</button></div></article>';

function cvPct(){var p=st.profile||{},f=[p.photo,st.user&&st.user.phoneNumber,p.edu,p.exp,p.skills,p.about,p.work,p.dist];return Math.round(f.filter(function(x){return x&&String(x).trim()}).length*100/f.length)}
function cvData(){var p=st.profile||{};return {name:dname(),phone:st.user.phoneNumber||"",email:st.user.email,addr:[p.dist,p.div?p.div+" বিভাগ":""].filter(Boolean).join(", "),photo:p.photo,about:p.about,edu:p.edu,edudet:p.edudet,exp:p.exp,work:p.work,skills:p.skills,salary:p.salary}}
function appCV(a){return {name:a.name,phone:a.phone,email:a.email,addr:a.loc,photo:a.photo,about:a.about,edu:a.edu,edudet:a.edudet,exp:a.exp,work:a.work,skills:a.skills,salary:a.salary}}
function cvHTML(d){
  var S=function(t,b){return b?'<div class="cvs"><h4>'+t+'</h4>'+b+'</div>':''};
  var ch=(d.skills||"").split(/[,،]/).map(function(x){return x.trim()}).filter(Boolean);
  var P=function(x){return x?'<p>'+esc(x)+'</p>':''};
  return '<div class="cvdoc"><div class="cvh">'+(d.photo?'<img src="'+d.photo+'" alt="">':'')+'<div><h2>'+esc(d.name)+'</h2>'+(d.phone?'<div>📞 '+esc(d.phone)+'</div>':'')+(d.email?'<div>✉️ '+esc(d.email)+'</div>':'')+(d.addr?'<div>📍 '+esc(d.addr)+'</div>':'')+'</div></div>'+
  S("নিজের সম্পর্কে",P(d.about))+S("শিক্ষাগত যোগ্যতা",P(d.edu)+P(d.edudet))+S("অভিজ্ঞতা",P(d.exp)+P(d.work))+
  S("দক্ষতা",ch.length?'<div class="cvchips">'+ch.map(function(c){return '<span>'+esc(c)+'</span>'}).join("")+'</div>':'')+S("প্রত্যাশিত বেতন",d.salary?'<p>৳ '+esc(d.salary)+'</p>':'')+'</div>';
}
function openCV(d,own){
  var note=own&&cvPct()<100?'<p class="co noprint">সিভি পূর্ণ করতে প্রোফাইল এডিট করে ছবি, নিজের সম্পর্কে ও অভিজ্ঞতা যোগ করুন।</p>':'';
  document.getElementById("sheet").innerHTML=cvHTML(d)+note+'<div class="noprint" style="margin-top:14px"><button class="btn" data-act="print">PDF / প্রিন্ট করুন</button></div>'+(own?'<div class="noprint" style="margin-top:10px"><button class="btn alt" data-act="editp">তথ্য এডিট করুন</button></div>':'')+'<div class="noprint" style="margin-top:10px"><button class="btn alt" id="close">বন্ধ করুন</button></div>';

function fileToPhoto(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var W=300,H=400,c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);var sc=Math.max(W/im.width,H/im.height),w=im.width*sc,h=im.height*sc;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);cb(c.toDataURL("image/jpeg",0.8))};im.onerror=function(){cb(null)};im.src=r.result};r.onerror=function(){cb(null)};r.readAsDataURL(file)}

function render(){var hx=document.getElementById("hextra"),av=document.getElementById("av");
  if(av){av.hidden=!st.user;if(st.user){if(st.profile&&st.profile.photo)av.innerHTML='<img src="'+st.profile.photo+'" alt="">';else av.textContent=dname().trim().charAt(0).toUpperCase()}}
  if(hx){var old=document.getElementById("hq"),ov=old?old.value:"",of=old&&document.activeElement===old,sv=nStats();
    hx.innerHTML=(st.user&&st.tab==="home")?'<div class="hsearch"><input id="hq" type="search" placeholder="চাকরি খুঁজুন" aria-label="চাকরি খুঁজুন"><button id="hsearch" aria-label="খুঁজুন">🔍</button></div><div class="stats"><div><b>'+bn(sv[0])+'</b><span>চালু চাকরি</span></div><div><b>'+bn(sv[1])+'</b><span>কোম্পানি</span></div><div><b>'+bn(sv[2])+'</b><span>নতুন চাকরি</span></div></div>':'<p class="tag">দেশের চাকরি, এক জায়গায়</p>';
    var nq=document.getElementById("hq");if(nq&&ov){nq.value=ov;if(of)nq.focus()}}
  var v=document.getElementById("view"),nav=document.querySelector("nav");
  if(st.user&&st.needPhone){v.innerHTML=viewPhone();nav.style.display="none";return}
  if(!st.user){v.innerHTML=st.landing?viewLanding():viewAuth();nav.style.display="none";return}

  var H=["home","🏠","হোম"];var T=isEmp()?[H,["jobs","🔍","চাকরি"],["post","＋","পোস্ট"],["applied","👥","আবেদনকারী"],["me","👤","আমি"]]:[H,["jobs","🔍","চাকরি"],["saved","★","সেভ"],["applied","✓","আবেদন"],["me","👤","আমি"]];

  var s=document.getElementById("sheet");
  var form=isEmp()?'<p class="co">আবেদন করতে চাকরিপ্রার্থীর অ্যাকাউন্ট লাগবে।</p>':ap?'<p><span class="badge">আপনি আবেদন করেছেন</span></p>':

function closeSheet(){document.getElementById("bg").classList.remove("on")}
function showErr(id,m){var e=document.getElementById(id);if(e)e.textContent=m}

document.addEventListener("click",function(e){
  var t=e.target;
  var sv=t.closest("[data-save]");
  if(sv){e.stopPropagation();var id=sv.getAttribute("data-save"),i=st.saved.indexOf(id);if(i>-1)st.saved.splice(i,1);else{st.saved.push(id);toast("চাকরি সেভ হয়েছে")}keep();render();return}
  var o=t.closest("[data-open]");if(o){openJob(o.getAttribute("data-open"));return}
  var tb=t.closest("[data-tab]");if(tb){st.tab=tb.getAttribute("data-tab");render();window.scrollTo(0,0);return}
  var go=t.closest("[data-go]");if(go){st.landing=false;st.mode=go.getAttribute("data-go");st.err="";render();return}
  var hc=t.closest("[data-hcat]");if(hc){st.cat=hc.getAttribute("data-hcat");st.q="";st.tab="jobs";render();window.scrollTo(0,0);return}
  if(t.id==="hsearch"){st.q=document.getElementById("hq").value;st.cat="সব";st.tab="jobs";render();window.scrollTo(0,0);return}
  if(t.id==="tohome"){st.landing=true;render();return}
  var ch=t.closest("[data-cat]");if(ch){st.cat=ch.getAttribute("data-cat");render();return}
  if(t.id==="close"||t.id==="bg"){closeSheet();return}
  if(t.id==="swap"){st.mode=st.mode==="login"?"signup":"login";st.err="";render();return}
  if(t.id==="logout"){signOut(auth);return}
  if(t.id==="editp"){openProfile();return}
  var ac=t.closest("[data-act]");
  if(ac){var k=ac.getAttribute("data-act");if(k==="editp")openProfile();else if(k==="cv")openCV(cvData(),true);else if(k==="print")window.print();return}
  var ca=t.closest("[data-cvapp]");
  if(ca){var ap2=st.apps[+ca.getAttribute("data-cvapp")];if(ap2)openCV(appCV(ap2),false);return}
  var tg=t.closest("[data-toggle]");
  if(tg){var i2=tg.getAttribute("data-toggle"),jj=st.mine.filter(function(j){return j.id===i2})[0];if(jj){var cl=!jj.closed;updateDoc(doc(db,"jobs",i2),{closed:cl}).then(function(){toast(cl?"চাকরি বন্ধ হয়েছে":"চাকরি আবার চালু হয়েছে")})}return}
  var dl=t.closest("[data-del]");
  if(dl){if(window.confirm("এই চাকরি মুছে ফেলবেন?"))deleteDoc(doc(db,"jobs",dl.getAttribute("data-del"))).then(function(){toast("চাকরি মুছে গেছে")});return}
  if(t.id==="savep"){
    var g=function(i){var x=document.getElementById(i);return x?x.value.trim():""};
    var nm=g("en");if(!nm){showErr("eerr","আপনার নাম লিখুন।");return}
    var d=isEmp()?{name:nm,company:g("ec"),address:g("ea"),div:g("ediv"),dist:g("edist")}:{name:nm,edu:g("eed"),exp:g("eex"),skills:g("esk"),about:g("eab"),edudet:g("eedd"),work:g("ewk"),salary:g("es"),div:g("ediv"),dist:g("edist")};
    t.disabled=true;
    setDoc(doc(db,"users",st.user.uid),d,{merge:true}).then(function(){Object.assign(st.profile,d);closeSheet();render();toast("প্রোফাইল সেভ হয়েছে")}).catch(function(){t.disabled=false;showErr("eerr","সেভ করা যায়নি। আবার চেষ্টা করুন।")});
    return}
  if(t.id==="chg"){st.conf=null;render();return}
  if(t.id==="sendotp"){
    var ph=document.getElementById("ph").value.trim();
    if(!/^(\+?88)?01[3-9]\d{8}$/.test(ph)){showErr("perr2","সঠিক মোবাইল নম্বর দিন, যেমন 01712345678।");return}
    var full="+88"+ph.replace(/^\+?88/,"");t.disabled=true;
    try{if(!window.rv)window.rv=new RecaptchaVerifier(auth,"rc",{size:"invisible"})}catch(x){}
    linkWithPhoneNumber(auth.currentUser,full,window.rv).then(function(c){st.conf=c;st.phone=full;render()})
    .catch(function(x){t.disabled=false;try{window.rv.clear()}catch(e){}window.rv=null;showErr("perr2",PERR[x.code]||"কোড পাঠানো যায়নি। আবার চেষ্টা করুন।")});
    return}
  if(t.id==="verify"){
    var code=document.getElementById("otp").value.trim();
    if(code.length!==6){showErr("perr2","৬ সংখ্যার কোডটি লিখুন।");return}
    t.disabled=true;
    st.conf.confirm(code).then(async function(){
      await auth.currentUser.reload();st.user=auth.currentUser;
      await setDoc(doc(db,"users",st.user.uid),{phone:st.user.phoneNumber},{merge:true});
      st.needPhone=false;st.conf=null;st.tab="home";subscribe();render();toast("মোবাইল নম্বর যাচাই হয়েছে");
    }).catch(function(x){t.disabled=false;showErr("perr2",PERR[x.code]||"যাচাই করা যায়নি। আবার চেষ্টা করুন।")});
    return}
  if(t.id==="doauth"){
    var em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value,su=st.mode==="signup";
    if(su){var nm=document.getElementById("nm").value.trim();if(!nm){showErr("aerr2","আপনার নাম লিখুন।");return}st.pending={name:nm,role:document.getElementById("rl").value}}
    t.disabled=true;
    (su?createUserWithEmailAndPassword(auth,em,pw):signInWithEmailAndPassword(auth,em,pw)).catch(function(x){t.disabled=false;showErr("aerr2",AERR[x.code]||"কিছু একটা ভুল হয়েছে। আবার চেষ্টা করুন।")});
    return}
  if(t.id==="doapply"){
    var n=document.getElementById("an").value.trim(),m=document.getElementById("am").value.trim(),j=st.sel;
    if(!n){showErr("aerr","আপনার নাম লিখুন।");return}
    if(!/^(\+?88)?01[3-9]\d{8}$/.test(m)){showErr("aerr","সঠিক মোবাইল নম্বর দিন, যেমন 01712345678।");return}
    t.disabled=true;
    addDoc(collection(db,"applications"),{jobId:j.id,title:j.t,company:j.c,employerId:j.uid,userId:st.user.uid,name:n,phone:m,edu:st.profile.edu||"",exp:st.profile.exp||"",skills:st.profile.skills||"",loc:[st.profile.dist,st.profile.div].filter(Boolean).join(", "),photo:st.profile.photo||"",about:st.profile.about||"",edudet:st.profile.edudet||"",work:st.profile.work||"",email:st.user.email,salary:st.profile.salary||"",note:document.getElementById("al").value.trim(),createdAt:serverTimestamp()})
    .then(function(){closeSheet();toast("আবেদন জমা হয়েছে")}).catch(function(){t.disabled=false;showErr("aerr","আবেদন জমা হয়নি। আবার চেষ্টা করুন।")});
    return}
  if(t.id==="dopost"){
    var a=document.getElementById("pt").value.trim(),b=document.getElementById("pc").value.trim(),d=document.getElementById("pd").value.trim();
    if(!a||!b||!d){showErr("perr","পদের নাম, কোম্পানি ও বিবরণ পূরণ করুন।");return}
    var s=document.getElementById("ps").value.trim();t.disabled=true;
    addDoc(collection(db,"jobs"),{t:a,c:b,cat:document.getElementById("pcat").value,div:document.getElementById("pdiv").value,dist:document.getElementById("pdist").value,up:getUp(),city:document.getElementById("pdist").value,sal:s?"৳ "+s:"আলোচনা সাপেক্ষে",type:"ফুল টাইম",d:d,uid:st.user.uid,createdAt:serverTimestamp()})
    .then(function(){st.tab="jobs";st.cat="সব";st.div="সব";st.dist="সব";st.q="";render();toast("চাকরি পোস্ট হয়েছে");window.scrollTo(0,0)})
    .catch(function(){t.disabled=false;showErr("perr","পোস্ট করা যায়নি। আবার চেষ্টা করুন।")});
  }
});
document.addEventListener("input",function(e){if(e.target.id==="q"){st.q=e.target.value;st.keepFocus=true;render()}});
document.addEventListener("change",function(e){var id=e.target.id,v=e.target.value;
  if(id==="fdiv"){st.div=v;st.dist="সব";render()}
  else if(id==="fdist"){st.dist=v;render()}
  else if(id==="pdiv"){document.getElementById("pdist").innerHTML=opts(LOC[v]);syncUp()}
  else if(id==="pdist"){syncUp()}
  else if(id==="pfile"){var f=e.target.files[0];if(f)fileToPhoto(f,function(d){if(!d){toast("ছবি পড়া যায়নি");return}setDoc(doc(db,"users",st.user.uid),{photo:d},{merge:true}).then(function(){st.profile.photo=d;render();toast("ছবি সেভ হয়েছে")}).catch(function(){toast("ছবি সেভ করা যায়নি")})})}
  else if(id==="ediv"){document.getElementById("edist").innerHTML=opts(LOC[v])}
  else if(id==="pup"){document.getElementById("pupx").style.display=v==="অন্যান্য"?"":"none"}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();if(e.key==="Enter"&&e.target.id==="hq"){document.getElementById("hsearch").click()}});
render();
</script>
</body>
</html>
